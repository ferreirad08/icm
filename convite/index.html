<!DOCTYPE html>

<html>
<head>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    body {
      background-image: url("https://raw.githubusercontent.com/ferreirad08/icm/refs/heads/main/convite/envelope.png");
      background-repeat: no-repeat;
      background-size: 100%;
      font-family: Arial;
    }

      #table {
        text-align: center;
        border: none;
        width: 95%;
        margin-left: 2.5%;
        margin-top: 500px;
      }

      button {
        font-size: 10px;
        color: #597b72;
        border: none;
        width: 70px;
        height: 70px;
        border-radius: 70px;
        text-align: center;
        box-shadow: -1px 1px 4px 0px grey;
        margin-top: 10px;
      }

  #animation {
    position: absolute;
    bottom: 10%;
    margin-left: 10px;
              font-family: 'Great Vibes', cursive;
              color: #386860;
              font-size: 40px;
              border-bottom: 5px solid #386860;
              overflow: hidden;
              animation: animate 2s linear forwards;
            }

            @keyframes animate {
                0% {
                    width: 0px;
                    height: 0px;
                }

                100% {
                  width: 350px;
                  height: 50px;
                }
            }

    .meu-confirmar {
      width: 100px;
        height: 50px;
        border-radius: 50px;
        background-color: #597b72;
        color: #fff;
    }
  </style>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title></title>
</head>
<body>
  <div id="animation" hidden>
    Ana Clara & José Lucas
  </div>

    <table id="table" hidden>
      <tr>
        <td>
          <button
            onclick="confirmar()"
          >
            Confirmar presença
          </button>
        </td>
        <td>
          <button
            onclick="window.location.href = 'https://www.bemol.com.br/lp'"
          >
            Lista de presentes
          </button>
        </td>
        <td>
          <button
            onclick="openPix()"
          >
            Presentear com pix
          </button>
        </td>
      </tr>
      <tr>
        <td>
          <button
            onclick="window.location.href = 'https://maps.app.goo.gl/focxhWRbngANU4hSA?g_st=aw'"
          >
            Localização cerimônia
          </button>
        </td>
        <td>
          <button
            onclick="window.location.href = 'https://ferreirad08.github.io/icm/'"
          >
            Localização recepção
          </button>
        </td>
        <td></td>
      </tr>
    </table>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    const namesList = `David
Carla
Abner

Estevão
Andreza
Pedro
Bernardo 

Juarez
Marta

Ednardo
Gabriela
Asafe
Acsa`;

    const invites = {};

    for (const family of namesList.split("\n\n")) {
      let k = "";
      const members = family.split("\n");
      members.forEach(m => k = k + m[0]);
      invites[k.toLowerCase()] = members;
    }

    const code = window.location.hash.slice(1);
    const phone = "5592999712074";
    const allNames = invites[code];

    const url = "https://github.com/ferreirad08/icm/raw/refs/heads/main/convite/Asmuitasaguas.mp3";
    const audio = new Audio(url);

    function ws(names) {
      console.log(JSON.stringify(names));
      const a = document.createElement("a");
      a.href = `https://wa.me/${phone}?text=
Oi, Lucas%0d%0a
%0d%0a
Confirmo a presença dos seguintes convidados:%0d%0a%0d%0a`;
      for (const name of names) {
        a.href = a.href + "*" + name + "*%0d%0a";
      }
      a.click();
    }

    function confirmar() {
      Swal.fire({
        title: "Confirmar presença",
        text: "Indique quais convidados estarão presentes.",
        html: (() => {
          let opt = "<table style='text-align: left'>";
          opt = opt + `Indique quais convidados estarão presentes.</br></br>`;
          for (let i = 0; i < allNames.length; i++) {
            opt = opt + `
            <tr>
              <td>
                <input type="checkbox" id="swal-input${i}" class="swal2-checkbox">
              </td>
              <td>
                <label for="swal-input${i}">${allNames[i]}</label>
              </td>
            </tr>
            `;
          }
          return opt + "</table>";
        })(),
        focusConfirm: false,
        preConfirm: () => {
          const a = [];
          for (let i = 0; i < allNames.length; i++) {
            if (Swal.getPopup().querySelector(`#swal-input${i}`).checked) {
              a.push(allNames[i]);
            }
          }
          return a;
        },
        confirmButtonText: "Enviar",
        customClass: {
          confirmButton: "meu-confirmar",
        },
      }).then((result) => {
        if (result.value) {
          ws(result.value);
        }
      });
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function openPix() {
      Swal.fire({
        imageUrl: "https://raw.githubusercontent.com/ferreirad08/icm/refs/heads/main/convite/pix.png",
        imageWidth: "100%",
        imageAlt: "A tall image",
        confirmButtonText: "Fechar",
        customClass: {
          confirmButton: "meu-confirmar",
        },
      });
    }

    document.addEventListener("click", async () => {
      document.body.style.backgroundImage = "url('https://raw.githubusercontent.com/ferreirad08/icm/refs/heads/main/convite/noivos.jpg')";
      document.getElementById("animation").hidden = false;
      await sleep(4000);
      document.getElementById("animation").hidden = true;
      document.body.style.backgroundImage = "url('https://raw.githubusercontent.com/ferreirad08/icm/refs/heads/main/convite/convite.png')";
      audio.play();
      document.getElementById("table").hidden = false;
    }, { once: true });
  </script> 
</body>
</html>
