<!DOCTYPE html>

<html>
<head>
  <style>
    body {
      background-image: url("https://raw.githubusercontent.com/ferreirad08/icm/refs/heads/main/convite/envelope.png");
      background-repeat: no-repeat;
      background-size: 100%;
    }

      table {
        text-align: center;
        border: none;
        width: 95%;
        margin-left: 2.5%;
        margin-top: 500px;
      }

      button {
        font-size: 10px;
        color: #597b72;
        border: none;
        width: 70px;
        height: 70px;
        border-radius: 70px;
        text-align: center;
        box-shadow: -1px 1px 4px 0px grey;
        margin-top: 10px;
      }

    .meu-confirmar {
      width: 100px;
        height: 50px;
        border-radius: 50px;
        background-color: #597b72;
        color: #fff;
    }
  </style>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title></title>
</head>
<body>
    <table id="table" hidden>
      <tr>
        <td>
          <button
            onclick="window.location.href = confirmation"
          >
            Confirmar presença
          </button>
        </td>
        <td>
          <button
            onclick="window.location.href = 'https://www.bemol.com.br/lp'"
          >
            Lista de presentes
          </button>
        </td>
        <td>
          <button
            onclick="openPix()"
          >
            Presentear com pix
          </button>
        </td>
      </tr>
      <tr>
        <td>
          <button
            onclick="window.location.href = 'https://maps.app.goo.gl/focxhWRbngANU4hSA?g_st=aw'"
          >
            Localização cerimônia
          </button>
        </td>
        <td>
          <button
            onclick="window.location.href = 'https://ferreirad08.github.io/icm/'"
          >
            Localização recepção
          </button>
        </td>
        <td></td>
      </tr>
    </table>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    const phone = "5592999712074";
    const confirmation = `https://wa.me/${phone}?text=
*Oi, Lucas*%0d%0a
%0d%0a
Confirmo minha presença.`;

    const url = "https://github.com/ferreirad08/icm/raw/refs/heads/main/convite/Asmuitasaguas.mp3";
    const audio = new Audio(url);

    function openPix() {
      Swal.fire({
        imageUrl: "https://raw.githubusercontent.com/ferreirad08/icm/refs/heads/main/convite/pix.png",
        imageWidth: "100%",
        imageAlt: "A tall image",
        confirmButtonText: "Fechar",
        customClass: {
          confirmButton: "meu-confirmar",
        },
      });
    }

    document.addEventListener("click", () => {
      document.body.style.backgroundImage = "url('https://raw.githubusercontent.com/ferreirad08/icm/refs/heads/main/convite/convite.png')";
      audio.play();
      document.getElementById("table").hidden = false;
    }, { once: true });
  </script> 
</body>
</html>
