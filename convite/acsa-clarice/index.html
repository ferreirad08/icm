<!DOCTYPE html>

<html>
<head>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    body {
      background-image: url("https://raw.githubusercontent.com/ferreirad08/icm/refs/heads/main/convite/acsa-clarice/envelope.png");
      background-repeat: no-repeat;
      background-size: 100%;
      font-family: 'Great Vibes', cursive;
    }

      #table {
        text-align: center;
        border: none;
        width: 95%;
        margin-left: 2.5%;
        margin-top: 380px;
      }

      button {
        font-family: 'Great Vibes', cursive;
        font-size: 20px;
        color: goldenrod;
        border: none;
        width: 80px;
        height: 80px;
        border-radius: 70px;
        text-align: center;
        box-shadow: -2px 1px 4px 0px goldenrod;
        margin-top: 10px;
        background-color: #597b72;
      }

  #touch {
    position: absolute;
    animation: is-rotating 3000ms infinite;
    top: 428px;
    font-family: 'Great Vibes', cursive;
    text-shadow: -1px 0 white, 0 1px white, 1px 0 white, 0 -1px white;
    color: goldenrod;
    font-size: 35px;
    width: 100%;
    left: 0%;
    text-align: center;
  }

  @keyframes is-rotating {
    50% {
      font-size: 25px;
    }
  }

  #animation {
    position: absolute;
    top: 300px;
    margin-left: 10%;
    width: 80%;
    text-shadow: -2px 0 black, 0 1px black, 2px 0 black, 0 -1px black;
    color: goldenrod;
    font-size: 40px;
    overflow: hidden;
  }

    .meu-confirmar {
      font-size: 20px;
      width: 100px;
      height: 50px;
      border-radius: 50px;
      box-shadow: -2px 1px 4px 0px goldenrod;
      background-color: #597b72;
      color: goldenrod;
    }
  </style>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title></title>
</head>
<body>
  <div id="animation" hidden>
    17 de julho às 19h30min
  </div>
  <div id="touch">
    Clique aqui
  </div>

    <table id="table" hidden>
      <tr>
        <td>
          <button
            onclick="ws()"
          >
            confirmar presença
          </button>
        </td>
        <td>
          <button
            onclick="window.location.href = 'https://maps.app.goo.gl/focxhWRbngANU4hSA?g_st=aw'"
          >
            localização da festa
          </button>
        </td>
        <td>
          <button
            onclick="presentes()"
          >
            sugestões de presentes
          </button>
        </td>
      </tr>
      <tr>
        <td></td>
      </tr>
    </table>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    const code = window.location.hash.slice(1);
    const phone = "5592999712074";

    const url = "https://github.com/ferreirad08/icm/raw/refs/heads/main/convite/acsa-clarice/parabens.mp3";
    const audio = new Audio(url);

    function ws() {
      const a = document.createElement("a");
      a.href = `https://wa.me/${phone}?text=Olá, gostaria de confirmar presença no aniversário da Acsa.`;
      a.click();
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function presentes() {
      Swal.fire({
        imageUrl: "https://raw.githubusercontent.com/ferreirad08/icm/refs/heads/main/convite/acsa-clarice/presentes.png",
        imageWidth: "80%",
        imageAlt: "A tall image",
        confirmButtonText: "Fechar",
        customClass: {
          confirmButton: "meu-confirmar",
        },
      });
    }

    document.addEventListener("click", async () => {
      audio.play();
      document.getElementById("touch").hidden = true;
      // document.body.style.backgroundImage = "url('https://raw.githubusercontent.com/ferreirad08/icm/refs/heads/main/convite/noivos.jpg')";
      // document.getElementById("noivos").hidden = false;
      document.getElementById("animation").hidden = false;
      // await sleep(5000);
      // document.getElementById("animation").hidden = true;
      // document.getElementById("noivos").hidden = true;
      document.body.style.backgroundImage = "url('https://raw.githubusercontent.com/ferreirad08/icm/refs/heads/main/convite/acsa-clarice/data.png')";
      document.getElementById("table").hidden = false;
    }, { once: true });
  </script> 
</body>
</html>
