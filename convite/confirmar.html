<!DOCTYPE html>
<html lang="pt-br">
<head>
  <style>
    .meu-confirmar {
      width: 100px;
      height: 50px;
      border-radius: 50px;
      background-color: #597b72;
      color: #fff;
    }
  </style>
  <meta charset="UTF-8">
  <title></title>
</head>

<body>
  <h2>Lista</h2>
  <button onclick="confirmar()">Confirmar</button>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    const names = [
      "David", "Carla Coelho Ferreira", "Abner Coelho Ferreira", "Darla"
    ];

    function confirmar() {
      Swal.fire({
        title: "Confirmar presença",
        text: "Indique quais convidados estarão presentes.",
        html: (() => {
          let opt = "<table style='text-align: left'>";
          opt = opt + `Indique quais convidados estarão presentes.</br></br>`;
          for (let i = 0; i < names.length; i++) {
            opt = opt + `
            <tr>
              <td>
                <input type="checkbox" id="swal-input${i}" class="swal2-checkbox">
              </td>
              <td>
                <label for="swal-input${i}">${names[i]}</label>
              </td>
            </tr>
            `;
          }
          return opt + "</table>";
        })(),
        focusConfirm: false,
        preConfirm: () => {
          const a = [];
          for (let i = 0; i < names.length; i++) {
            if (Swal.getPopup().querySelector(`#swal-input${i}`).checked) {
              a.push(names[i]);
            }
          }
          return a;
        },
        confirmButtonText: "Enviar",
        customClass: {
          confirmButton: "meu-confirmar",
        },
      }).then((result) => {
        if (result.value) {
          console.log(JSON.stringify(result.value));
        }
      });
    }
  </script>
</body>
</html>
