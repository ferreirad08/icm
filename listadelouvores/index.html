<html>
  <head>

    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }

      table[name="Header"] {
        width: 100%;
        height: 50px;
        color: #151b54;
        box-shadow: 0px 2px 2px -1px grey;
        position: absolute;
        top: 0%;
        left: 0%;
      }

      table[name="Header"] td {
        font-size: 15px;
        font-weight: bold;
        border: none;
        width: calc(100% / 6);
      }

      #table {
        border-collapse: collapse;
        border: 1px solid #000;
        width: 350px;
        margin-left: calc(50% - 175px);
        box-shadow: -1px 1px 4px 0px grey;
      }

      a {
        margin-left: calc(50% - 175px);
      }

      img {
        width: 150px;
      }

      #title {
        padding-left: 15px;
      }

      .icon {
        font-size: 40px;
      }

      #logo {
        padding-top: 8px;
        padding-left: 8px;
        text-align: left;
      }

      #line1,
      #line2 {
        font-weight: bold;
      }

      #line1 td {
        border: none;
      }

      #line2 {
        background-color: #ddd;
      }

      #dateLabel {
        text-align: right !important;
      }

      #date {
        padding-right: 15px;
        text-decoration: underline;
      }

      td {
        border: 1px solid #000;
        padding: 4px;
        text-align: center;
        font-size: 14px;
        height: 20px;
        width: calc(350px / 5);
      }

      tr:nth-child(n+4) td:nth-child(even) {
        text-align: left;
      }

      button {
        background-color: #151b54;
        color: #ffffff;
        border: none;
        padding-left: 13px;
        padding-right: 13px;
        height: 40px;
        border-radius: 40px;
        font-weight: bold;
        text-align: center;
      }

      #button_0 {
        margin-left: calc(50% - 175px);
        background-color: #ffffff;
        color: #151b54;
        border: 2px solid #151b54;
      }

      .meu-confirmar {
        width: 145px;
        border-radius: 20px !important;
        background-color: #151b54;
        color: white;
      }

      .meu-cancelar {
        width: 145px;
        border-radius: 20px !important;
        background-color: white;
        color: #151b54;
        border: 2px solid #151b54;
      }

      #swal-input-date:focus {
        outline: none;
        border-bottom: 2px solid #151b54;
        border-top: none;
        border-left: none;
        border-right: none;
      }

      :root {
        --date-width: 230px;
      }

      #swal-input-date {
        width: var(--date-width);
        margin-left: calc(50% - var(--date-width) / 2);
        font-family: Arial, Helvetica, sans-serif;
        background-color: #ffffff;
        font-size: 15px;
        border: none;
        border-radius: 0px;
        border-bottom: 1px solid gray;
        border-top: none;
        border-left: none;
        border-right: none;
      }

      #filter-input {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #ffffff;
        font-size: 18px;
        border: none;
        width: var(--date-width);
      }

      #filter-input:focus,
      .meu-input-estilizado:focus {
        outline: none;
        border-bottom: 2px solid #151b54;
        border-top: none;
        border-left: none;
        border-right: none;
      }

      #filter-input,
      .meu-input-estilizado {
        border-radius: 0px;
        border-bottom: 1px solid gray;
        border-top: none;
        border-left: none;
        border-right: none;
      }

      #filter-results div {
        width: var(--date-width);
        height: 30px;
        font-size: 15px;
        margin-left: calc(50% - var(--date-width) / 2);
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 5px;
        padding-right: 5px;
        border-radius: 0px;
        box-shadow: 0px 2px 2px -1px grey;
        text-align: left;
        /*border: 1px solid gray;*/
      }

      .obs {
        color: red;
        margin-left: 10px;
      }
    </style>
    <meta charset="utf-8" />

      <tr>
        <td id="70" onclick="setNumber(this.id)"></td>
        <td id="71" onclick="setName(this.id)" colspan="4" draggable="true" ondragstart="dragstart_handler(event);" ondrop="drop_handler(event);" ondragover="dragover_handler(event);"></td>
      </tr>
      <tr>
        <td id="80" onclick="setNumber(this.id)"></td>
        <td id="81" onclick="setName(this.id)" colspan="4" draggable="true" ondragstart="dragstart_handler(event);" ondrop="drop_handler(event);" ondragover="dragover_handler(event);"></td>

    <br />
    <button id="button_0" onclick="clean()">
      <i class="bi bi-x-lg"></i>&ensp;Limpar
    </button>
    <button id="button_1" onclick="share()">
      <i class="bi bi-share"></i>&ensp;Compartilhar
    </button>

    <br />
    <br />
    <br />
    <a href="https://clustrmaps.com/site/1c8b0" title="ClustrMaps"
      ><img
        src="//www.clustrmaps.com/map_v2.png?d=cD42sDbJvXfYXvnLmjnuANiZWi_lP1_lbHzNxO69gVw&cl=ffffff"
    /></a>

    <script src="louvores.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script>
      const storageKey = "listadelouvores";
      let list = window.localStorage.getItem(storageKey);
      list =
        list === null
          ? {
              date: getFormattedDate(),
            }
          : JSON.parse(list);

      for (const key in list) {
        el = document.getElementById(key);
        el.innerHTML = list[key];
      }

      const icmLogoUrl =
        "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ7VhuSl9_SSmUIK1g0PnEAzs7EJTm7mroeDQ&usqp=CAU";
      setImage({ src: icmLogoUrl });

      async function setImage(img) {
        const blob = await (await fetch(img.src)).blob();
        const reader = new FileReader();
        reader.onloadend = function () {
          document.getElementById("logoImg").src = reader.result;
        };
        reader.readAsDataURL(blob);
      }

      function numberInput(key) {
        Swal.fire({
          title: "Número do louvor",
          text: "Insira o número!",
          input: "number",
          inputValue: list[key],
          showCancelButton: true,
          reverseButtons: true,
          cancelButtonText: "Cancelar",
          customClass: {
            confirmButton: "meu-confirmar",
            cancelButton: "meu-cancelar",
            input: "meu-input-estilizado",
          },
        }).then((result) => {
          if (Number(result.value)) {
            list[key] = result.value;
            window.localStorage.setItem(storageKey, JSON.stringify(list));
            el = document.getElementById(key);
            el.innerHTML = list[key];
          }
        });
      }

      function setNumber(key) {
        return setName(key);
        return numberInput(key);

        const number = window.prompt("Insira o número!", list[key]);
        if (Number(number)) {
          list[key] = number;
          window.localStorage.setItem(storageKey, JSON.stringify(list));
          el = document.getElementById(key);
          el.innerHTML = list[key];
        }
      }

      function saveName(key, name) {
        Swal.close();

        const [_number, _name] = name.split(" - ");
        list[key[0] + "0"] = _number;
        list[key[0] + "1"] = _name.toUpperCase();
        window.localStorage.setItem(storageKey, JSON.stringify(list));

        let el;

        el = document.getElementById(key[0] + "0");
        el.innerHTML = list[key[0] + "0"];

        el = document.getElementById(key[0] + "1");
        el.innerHTML = list[key[0] + "1"];
      }

      function normalizeText(text) {
        return text
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase();
      }

      function setName(key) {
        const type = key[1] === "0" ? "number" : "text";
        const title = type === "number" ? "Número do louvor" : "Nome do louvor";
        const subtitle = type === "number" ? "Insira o número!" : "Insira o nome!";
        const value = list[key] || "";

        Swal.fire({
          title,
          html: `
          ${subtitle}
          </br></br>
          <input type="${type}" id="filter-input" placeholder="Pesquisar..." value="${value}">
          <div id="filter-results"></div>`,
          showConfirmButton: false,
          showCancelButton: true,
          cancelButtonText: "Cancelar",
          customClass: {
            cancelButton: "meu-cancelar",
          },
          didOpen: () => {
            const input = document.getElementById("filter-input");
            const results = document.getElementById("filter-results");

            input.addEventListener("input", () => {
              results.innerHTML = key[1] === "0" ? "" : // is number
                `<div onclick="saveName('${key}','* - ${input.value}')">${input.value}</div>`;

              let count = 0;
              for (item of hinos) {
                item = item.replace("'", " ");
                if (normalizeText(item).includes(normalizeText(input.value))) {
                  count++;
                  if (count > 5) break;
                  results.innerHTML =
                    results.innerHTML +
                    `<div onclick="saveName('${key}','${item}')">${item}</div>`;
                }
              }
            });
          },
        });
      }

      const options = [
  "1 - O sangue de Jesus tem poder",
  "2 - O sangue de Jesus tem poder para salvar",
  "3 - Clamo a ti",
  "4 - Quando te prostrares",
  "5 - Clamando estou"
      ];

      function nameInputOld(key) {
        Swal.fire({
          title: "Nome da louvor",
          inputAttributes: {
            placeholder: "Nome",
          },
          text: "Insira o nome!",
          input: "text",
          inputValue: list[key],
          showCancelButton: true,
          reverseButtons: true,
          cancelButtonText: "Cancelar",
          customClass: {
            cancelButton: "meu-cancelar",
            confirmButton: "meu-confirmar",
            input: "meu-input-estilizado",
          },
        }).then((result) => {
          if (result.value) {
            list[key] = result.value.toUpperCase();
            window.localStorage.setItem(storageKey, JSON.stringify(list));
            el = document.getElementById(key);
            el.innerHTML = list[key];
          }
        });
      }

      function setNameOld(key) {
        return nameInput(key);
        const name = window.prompt("Insira o nome!", list[key]);
        if (name) {
          list[key] = name.toUpperCase();
          window.localStorage.setItem(storageKey, JSON.stringify(list));
          el = document.getElementById(key);
          el.innerHTML = list[key];
        }
      }

      function setDate(key) {
        Swal.fire({
          title: "Data do culto",
          text: "Insira a data do culto!",
          html: '<input type="date" id="swal-input-date" class="swal2-input">',
          focusConfirm: false,
          showCancelButton: true,
          reverseButtons: true,
          customClass: {
            confirmButton: "meu-confirmar",
            cancelButton: "meu-cancelar",
          },
          preConfirm: () => {
            return document.getElementById("swal-input-date").value;
          },
        }).then((result) => {
          if (result.value) {
            list[key] = result.value.split("-").reverse().join("/");
            window.localStorage.setItem(storageKey, JSON.stringify(list));
            el = document.getElementById(key);
            el.innerHTML = list[key];
          }
        });
      }

      function clean() {
        Swal.fire({
          title: `Confirmar limpeza?`,
          text: "Todos os dados serão apagados!",
          icon: "question",
          showCancelButton: true,
          reverseButtons: true,
          confirmButtonText: `<i class="bi bi-check-lg"></i>&ensp;Sim, limpar`,
          cancelButtonText: `<i class="bi bi-x-lg"></i>&ensp;Cancelar`,
          customClass: {
            confirmButton: "meu-confirmar",
            cancelButton: "meu-cancelar",
          },
        }).then((result) => {
          if (result.isConfirmed) {
            cleanCb();
          }
        });
      }

      function cleanCb() {
        const date = getFormattedDate();

        for (const key in list) {
          document.getElementById(key).innerHTML =
            key === "date" ? date : "";
        }

        // window.localStorage.removeItem(storageKey);
        list = { date };
        window.localStorage.setItem(storageKey, JSON.stringify(list));
      }

      function getFormattedDate() {
        const today = new Date();
        return (
          String(today.getDate()).padStart(2, "0") +
          "/" +
          String(today.getMonth() + 1).padStart(2, "0") +
          "/" +
          today.getFullYear()
        );
      }

      function share() {
        Swal.fire({
          title: "Criando imagem...",
          allowOutsideClick: false,
          didOpen: () => {
            Swal.showLoading();
          },
        });

        html2canvas(document.getElementById("table")).then(canvas2file);
      }

      async function canvas2file(canvas) {
        fetch(canvas.toDataURL("image/jpeg")).then(function (res) {
          res.blob().then(function (blob) {
            const files = [new File([blob], "listadelouvores.jpg", blob)];
            Swal.close();
            navigator.share({ files, url: window.location.href });
          });
        });
      }

      let lastTarget;

      function setColor(color) {
        document.getElementById(lastTarget[0] + 0).style.borderBottom = color === "white" ? "2px solid #151b54" : "";
        document.getElementById(lastTarget[0] + 1).style.borderBottom = color === "white" ? "2px solid #151b54" : "";
      }

      function replaceLines(l0, l1) {
        for (col of ["0", "1"]) {
          document.getElementById(l1 + col).innerHTML = list[l0 + col] || "";
          document.getElementById(l0 + col).innerHTML = list[l1 + col] || "";
          list[l0 + col] = list[l1 + col];
          list[l1 + col] = document.getElementById(l1 + col).innerHTML;
        }
      }

      function dragstart_handler(ev) {
        ev.dataTransfer.setData("text/plain", ev.target.id);
        ev.dropEffect = "move";

        lastTarget = ev.target.id;
      }

      function dragover_handler(ev) {
        ev.preventDefault();
        ev.dataTransfer.dropEffect = "move";

        replaceLines(lastTarget[0], ev.target.id[0]);
        setColor("black");
        lastTarget = ev.target.id;
        setColor("white");
      }

      function drop_handler(ev) {
        ev.preventDefault();

        setColor("black");
        window.localStorage.setItem(storageKey, JSON.stringify(list));
      }

      const url = "https://7h347wvikoqbrtlu32vy6runam0uccna.lambda-url.us-east-1.on.aws/";
      const data = await (await fetch(url, {
        credentials: "include",
      })).json();
      console.log(JSON.stringify(data));
      console.log(document.cookie);
    })();*/
    </script>
