    <script>
      const listaFinal = [...hinos, ...cias]
        .sort((a, b) => {
        const numA = parseInt(a.split(" - ")[0], 10);
        const numB = parseInt(b.split(" - ")[0], 10);
        return numA - numB;
      });

      const storageKey = "listadelouvores";
      let list = window.localStorage.getItem(storageKey);
      list =
        list === null
          ? {
              date: getFormattedDate(),
            }
          : JSON.parse(list);

      for (const key in list) {
        el = document.getElementById(key);
        el.innerHTML = list[key];
      }

      const icmLogoUrl =
        "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ7VhuSl9_SSmUIK1g0PnEAzs7EJTm7mroeDQ&usqp=CAU";
      setImage({ src: icmLogoUrl });

      async function setImage(img) {
        const blob = await (await fetch(img.src)).blob();
        const reader = new FileReader();
        reader.onloadend = function () {
          document.getElementById("logoImg").src = reader.result;
        };
        reader.readAsDataURL(blob);
      }

      function saveText(key, text) {
        Swal.close();

        let _number = "", _name = "";

        if (text.includes(" - ")) {
          [ _number, _name ] = text.split(" - ");
        } else {
          _name = text;
        }

        document.getElementById(key[0] + 1).innerHTML = _name.toUpperCase();
        list[key[0] + 1] = _name.toUpperCase();
        document.getElementById(key[0] + 0).innerHTML = _number;
        list[key[0] + 0] = _number;
        window.localStorage.setItem(storageKey, JSON.stringify(list));
      }

      function normalizeText(text) {
        return text
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase();
      }

      function setName(key) {
        const type = key[1] === "0" ? "number" : "text";
        const title = type === "number" ? "Número do louvor" : "Nome do louvor";
        const subtitle =
          type === "number" ? "Insira o número!" : "Insira o nome!";
        const value = list[key] || "";

        Swal.fire({
          title,
          html: `
          ${subtitle}
          </br></br>
          <input type="${type}" id="filter-input" placeholder="Pesquisar..." value="${value}">
          <div id="filter-results"></div>`,
          showConfirmButton: false,
          showCancelButton: true,
          cancelButtonText: "Cancelar",
          showDenyButton: true,
          denyButtonText: `<i class="bi bi-trash3"></i>&ensp;Excluir`,
          customClass: {
            cancelButton: "meu-cancelar",
            denyButton: "my-deny",
          },
          didOpen: () => {
            const input = document.getElementById("filter-input");
            const results = document.getElementById("filter-results");

            input.addEventListener("input", () => {
              let tempList;

              if (Number.isNaN(Number(input.value))) {
                tempList = [input.value, ...listaFinal];
              } else {
                tempList = listaFinal;
              }

              results.innerHTML = "";

              let count = 0;

              for (item of tempList) {
                item = item.replace("'", " ");
                if (normalizeText(item).includes(normalizeText(input.value))) {
                  count++;
                  if (count > 6) break;
                  results.innerHTML =
                    results.innerHTML +
                    `<div onclick="saveText('${key}','${item}')">${item}</div>`;
                }
              }
            });
          },
        }).then((result) => {
          if (result.isConfirmed) {
            console.log("OK clicked");
          }
          if (result.isDenied) {
            document.getElementById(key[0] + 1).innerHTML = "";
            delete list[key[0] + 1];
            document.getElementById(key[0] + 0).innerHTML = "";
            delete list[key[0] + 0];
            window.localStorage.setItem(storageKey, JSON.stringify(list));
          }
          if (result.isDismissed) {
            console.log("Cancelled.");
          }
        });
      }

      function setDate(key) {
        Swal.fire({
          title: "Data do culto",
          text: "Insira a data do culto!",
          html: '<input type="date" id="swal-input-date" class="swal2-input">',
          focusConfirm: false,
          showCancelButton: true,
          reverseButtons: true,
          customClass: {
            confirmButton: "meu-confirmar",
            cancelButton: "meu-cancelar",
          },
          preConfirm: () => {
            return document.getElementById("swal-input-date").value;
          },
        }).then((result) => {
          if (result.value) {
            list[key] = result.value.split("-").reverse().join("/");
            window.localStorage.setItem(storageKey, JSON.stringify(list));
            el = document.getElementById(key);
            el.innerHTML = list[key];
          }
        });
      }

      function clean() {
        Swal.fire({
          title: `Confirmar limpeza?`,
          text: "Todos os dados serão apagados!",
          icon: "question",
          showCancelButton: true,
          reverseButtons: true,
          confirmButtonText: `<i class="bi bi-check-lg"></i>&ensp;Sim, limpar`,
          cancelButtonText: `<i class="bi bi-x-lg"></i>&ensp;Cancelar`,
          customClass: {
            confirmButton: "meu-confirmar",
            cancelButton: "meu-cancelar",
          },
        }).then((result) => {
          if (result.isConfirmed) {
            const date = getFormattedDate();

            for (const key in list) {
              document.getElementById(key).innerHTML =
                key === "date" ? date : "";
            }

            list = { date };
            window.localStorage.setItem(storageKey, JSON.stringify(list));
          }
        });
      }

      function getFormattedDate() {
        const today = new Date();
        return (
          String(today.getDate()).padStart(2, "0") +
          "/" +
          String(today.getMonth() + 1).padStart(2, "0") +
          "/" +
          today.getFullYear()
        );
      }

      function share() {
        Swal.fire({
          title: "Criando imagem...",
          allowOutsideClick: false,
          didOpen: () => {
            Swal.showLoading();
          },
        });

        html2canvas(document.getElementById("table")).then(canvas2file);
      }

      async function canvas2file(canvas) {
        fetch(canvas.toDataURL("image/jpeg")).then(function (res) {
          res.blob().then(function (blob) {
            const files = [new File([blob], "listadelouvores.jpg", blob)];
            Swal.close();
            navigator.share({ files, url: window.location.href });
          });
        });
      }

      let lastTarget;

      function setColor(color) {
        document.getElementById(lastTarget[0] + 0).style.borderBottom =
          color === "white" ? "2px solid #151b54" : "";
        document.getElementById(lastTarget[0] + 1).style.borderBottom =
          color === "white" ? "2px solid #151b54" : "";
      }

      function replaceLines(l0, l1) {
        for (col of ["0", "1"]) {
          document.getElementById(l1 + col).innerHTML = list[l0 + col] || "";
          document.getElementById(l0 + col).innerHTML = list[l1 + col] || "";
          list[l0 + col] = list[l1 + col];
          list[l1 + col] = document.getElementById(l1 + col).innerHTML;
        }
      }

      function dragstart_handler(ev) {
        ev.dataTransfer.setData("text/plain", ev.target.id);
        ev.dropEffect = "move";

        lastTarget = ev.target.id;
      }

      function dragover_handler(ev) {
        ev.preventDefault();
        ev.dataTransfer.dropEffect = "move";

        replaceLines(lastTarget[0], ev.target.id[0]);
        setColor("black");
        lastTarget = ev.target.id;
        setColor("white");
      }

      function drop_handler(ev) {
        ev.preventDefault();

        setColor("black");
        window.localStorage.setItem(storageKey, JSON.stringify(list));
      }
