<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }

      label {
        color: #151b54;
        font-weight: bolder;
        font-size: 20px;
      }

      #container {
        text-align: center;
        position: absolute;
        height: 90%;
        top: 5%;
        width: 90%;  
        left: 5%;
      }

      #reader {
        box-shadow: -1px 1px 4px 0px grey;
        width: 80%;  
        left: 10%;          
      }

      #cleanBtn {
        background-color: #151b54;
        color: #fff;
        border: none;
        /*width: 110px;*/
        height: 40px;
        border-radius: 40px;
        font-weight: bold;
        font-size: 12px;
        padding-left: 13px;
        padding-right: 13px;
      }
    </style>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Produtos</title>
</head>
<body>
    <div id="container">
      <br/><br />
      <label>Aponte a câmera para o QR Code</label>
      <br />
      <br /><br />
      <div id="reader"></div>
      <br /><br />
      <button id="cleanBtn" onclick="cancel()">
        <i class="bi bi-x-lg"></i>&ensp;Cancelar
      </button>
    </div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<script>
  const scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 200 },
    (decodedText) => {
      sendNote(decodedText);
      scanner.stop();
    },
    (error) => {}
  );

  function cancel() {
    alert(1);
  }

      const url = "https://api.jsonbin.io/v3/b";

      const headers = {
        "Content-Type": "application/json",
        "X-Access-Key":
          "$2a$10$LfB9pdrUiu066R6K8lu9cOnlKiXIdSxewVhiRKUfxAhQkpgNFCXxe",
        "X-Bin-Name": "precocompartilhado",
      };

  async function sendNote(page) {
    Swal.fire({
          title: "Aguarde...",
          allowOutsideClick: false,
          didOpen: () => {
            Swal.showLoading();
          },
        });

    const res = await fetch(url, {
          method: "POST",
          headers: {
            ...headers,
            "X-Collection-Id": "69214d07ae596e708f68e6f4",
          },
          body: JSON.stringify({ page }),
    });

    Swal.close();

    if (
      res.status === 200 &&
      res.headers.get("Content-Type") === "application/json; charset=utf-8"
    ) {
     window.location.href = page;
    } else {
      alert("errror");
      cancel();
    }
  }
</script>
</body>
</html>
